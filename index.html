<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>24 días contigo ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ff758c,#ff7eb3);
    min-height:100vh;
    padding:30px;
    color:white;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitulo{
    text-align:center;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:15px;
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    color:#ff4f81;
    border-radius:16px;
    height:120px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.card:hover{
    transform:scale(1.05);
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-content{
    background:white;
    color:#333;
    max-width:600px;
    width:100%;
    border-radius:20px;
    padding:25px;
    text-align:center;
}

.modal-content h2{
    color:#ff4f81;
    margin-bottom:15px;
}

.cerrar{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#ff4f81;
    color:white;
    cursor:pointer;
}

.mensaje{
    line-height:1.6;
}
</style>
</head>

<body>

<h1>❤️ 27 DÍAS PARA ENAMORARTE ❤️</h1>

<p class="subtitulo">
Es el plan maestro que tengo para demostrarte que puedo aprender a hacerte sentir amada  en la forma en que lo mereces.
</p>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="titulo"></h2>
        <div class="mensaje" id="contenido"></div>
        <button class="cerrar" onclick="cerrarModal()">Cerrar ❤️</button>
    </div>
</div>

<script>

const dias = [

{

{

},

{

{

{

}

];

const grid = document.getElementById("grid");

dias.forEach((dia,index)=>{
    const card = document.createElement("div");
    card.className="card";
    card.innerText=index+1;
    card.onclick=()=>abrirDia(index);
    grid.appendChild(card);
});

function abrirDia(index){

    const ahora = new Date();

    const fechaApertura = new Date(
        dias[index].fecha
    );

    document.getElementById("titulo").innerText =
        dias[index].titulo;

    if(ahora < fechaApertura){

        document.getElementById("contenido").innerHTML =
        `
        <h3>🔒 Regalo bloqueado</h3>
        <p>
        Este regalo estará disponible el
        <strong>${fechaApertura.toLocaleString()}</strong>
        </p>
        `;

    }else{

        document.getElementById("contenido").innerHTML =
        dias[index].texto;

    }

    document.getElementById("modal").style.display = "flex";
}

function cerrarModal(){
    document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
