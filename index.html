dias.forEach((dia,index)=>{
    const card = document.createElement("div");

    card.innerText=index+1;
    card.onclick=()=>abrirDia(index);
    grid.appendChild(card);
});

function abrirDia(index){

    const ahora = new Date();

    const fechaApertura = new Date(
        dias[index].fecha
    );

    document.getElementById("titulo").innerText =
        dias[index].titulo;

        const meses = [
        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre"
    ];

    const dia = fechaApertura.getDate();
    const mes = meses[fechaApertura.getMonth()];

    let hora = fechaApertura.getHours();
    const minutos = fechaApertura.getMinutes();

    const periodo = hora >= 12 ? "p.m." : "a.m.";

    hora = hora % 12;
    hora = hora === 0 ? 12 : hora;

    const minutosTexto =
        minutos < 10 ? `0${minutos}` : minutos;

    const fechaBonita =
    `${dia} de ${mes} a las ${hora}:${minutosTexto} ${periodo}`;

    if(ahora < fechaApertura){

        document.getElementById("contenido").innerHTML =
        `
        <h3>🔒 Este detalle aún está bloqueado</h3>
        <p>
        Este regalo estará disponible el
        <strong>${fechaBonita}</strong>
        ❤️
        </p>
        `;

    }else{

        document.getElementById("contenido").innerHTML =
        dias[index].texto;

    }

    document.getElementById("modal").style.display = "flex";
}
